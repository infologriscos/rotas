<!DOCTYPE html>
<html>
<head>
    <title>Visualizador de Rotograma</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <style>
        /* Estilos CSS permanecem os mesmos */
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); z-index: 1000; }
        .hidden { display: none; }
        #info-panel { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); max-width: 300px; z-index: 1000; }
        #open-in-maps { margin-top: 10px; padding: 8px 12px; background-color: #4285F4; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .custom-info-window { max-width: 250px; line-height: 1.4; } /* Melhoria no espaçamento */
        .custom-info-window strong { display: block; margin-bottom: 3px; font-size: 1.1em; color: #333; } /* Título Categoria */
        .custom-info-window .point-name { font-weight: bold; color: #555;} /* Nome do Ponto */
        #legend { position: absolute; bottom: 30px; left: 10px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); z-index: 1000; font-size: 12px; max-height: 40%; overflow-y: auto;}
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .legend-icon { width: 24px; height: 24px; margin-right: 8px; object-fit: contain;}
        #legend h6 { margin-top: 0; margin-bottom: 8px; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="loading">Carregando Rotograma...</div>
    <div id="info-panel" class="hidden">
        <div id="info-content"></div>
        <button id="open-in-maps" class="hidden">Abrir Rota no App do Google Maps</button>
    </div>
    <div id="legend" class="hidden"><h6>Legenda</h6></div>

    <script>
        // Variáveis globais
        let map;
        let routeWaypoints = [];
        let kmlDocumentGlobal = null;

        function initMap() {
            const urlParams = new URLSearchParams(window.location.search);
            const kmlUrl = urlParams.get('kml');

            if (!kmlUrl) {
                showError('Erro: Nenhuma URL de KML foi fornecida.');
                return;
            }

            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 4, center: { lat: -14.235, lng: -51.925 }, mapTypeControl: false, streetViewControl: false
            });

            document.getElementById('open-in-maps').addEventListener('click', openRouteInGoogleMaps);
            loadKml(kmlUrl, map);
        }

        function loadKml(kmlUrl, map) {
            const loadingDiv = document.getElementById('loading');
            loadingDiv.classList.remove('hidden');

            fetch(kmlUrl)
                .then(response => {
                    if (!response.ok) { throw new Error(`HTTP error! status: ${response.status}`); } // Melhora log de erro
                    return response.text();
                })
                .then(kmlText => {
                    kmlDocumentGlobal = processKml(kmlText, map);
                    if (kmlDocumentGlobal) { createLegend(kmlDocumentGlobal); }
                    loadingDiv.classList.add('hidden');
                })
                .catch(error => {
                    console.error('Erro ao carregar ou processar KML:', error);
                    showError(`Erro ao carregar KML: ${error.message}. Verifique a URL e a conexão.`);
                });
        }

        // --- FUNÇÃO processKml MODIFICADA ---
        function processKml(kmlText, map) {
            const parser = new DOMParser();
            const kmlDoc = parser.parseFromString(kmlText, 'text/xml');

            if (kmlDoc.getElementsByTagName("parsererror").length > 0) {
                console.error("Erro de parse KML:", kmlDoc.getElementsByTagName("parsererror")[0].textContent);
                showError('Erro ao processar o KML. Verifique se o arquivo é um XML válido.');
                return null;
            }

            const styles = extractStyles(kmlDoc);
            const bounds = new google.maps.LatLngBounds();
            routeWaypoints = []; // Limpa rotas anteriores

            // *** MUDANÇA AQUI: Iterar por Pastas (Folders) primeiro ***
            const kmlFolders = kmlDoc.querySelectorAll('Document > Folder');
            kmlFolders.forEach(folder => {
                const folderName = folder.querySelector('name')?.textContent || 'Sem Categoria';
                const placemarksInFolder = folder.querySelectorAll('Placemark');

                placemarksInFolder.forEach(placemark => {
                    // Passa o nome da pasta para processPlacemark
                    processPlacemark(placemark, folderName, styles, map, bounds);
                });
            });
            // *** FIM DA MUDANÇA ***

            if (!bounds.isEmpty()) {
                map.fitBounds(bounds);
            } else {
                 console.warn("Nenhum elemento KML encontrado para ajustar limites do mapa.");
                 // Pode definir um zoom/centro padrão se nada for encontrado
                 map.setCenter({ lat: -14.235, lng: -51.925 });
                 map.setZoom(4);
            }

            showKmlInfo(kmlDoc);
            return kmlDoc;
        }
        // --- FIM DA FUNÇÃO processKml ---


        function extractStyles(kmlDoc) {
            // ...(função inalterada)...
            const styles = {};
            const styleMapElements = kmlDoc.getElementsByTagName('StyleMap');
            for (let i = 0; i < styleMapElements.length; i++) {
                const id = '#' + styleMapElements[i].getAttribute('id');
                if (id) {
                    const normalStyleUrl = styleMapElements[i].querySelector('Pair > key:contains("normal") + styleUrl')?.textContent;
                    if (normalStyleUrl) {
                         const normalStyle = kmlDoc.querySelector(`Style[id="${normalStyleUrl.substring(1)}"]`);
                         if (normalStyle) {
                             const iconHref = normalStyle.querySelector('IconStyle > Icon > href')?.textContent;
                             styles[id] = { iconHref: iconHref || null };
                         }
                    }
                }
            }
            const styleElements = kmlDoc.getElementsByTagName('Style');
            for (let i = 0; i < styleElements.length; i++) {
                const id = '#' + styleElements[i].getAttribute('id');
                if (id && !styles[id]) {
                    const iconHref = styleElements[i].querySelector('IconStyle > Icon > href')?.textContent;
                    if(iconHref) {
                         styles[id] = { iconHref };
                    }
                }
            }
            return styles;
        }

        // --- FUNÇÃO processPlacemark MODIFICADA ---
        // Adicionado parâmetro folderName
        function processPlacemark(placemark, folderName, styles, map, bounds) {
            const name = placemark.querySelector('name')?.textContent || '';
            const description = placemark.querySelector('description')?.textContent || '';
            const styleUrl = placemark.querySelector('styleUrl')?.textContent || '';
            const style = styles[styleUrl] || {}; // Estilo referenciado

            // Cores e larguras que podem ser definidas inline no Placemark (têm prioridade)
            const inlineLineColor = placemark.querySelector('LineStyle > color')?.textContent;
            const inlineLineWidth = placemark.querySelector('LineStyle > width')?.textContent;
            const inlinePolyColor = placemark.querySelector('PolyStyle > color')?.textContent;
            // Cor de contorno do polígono (se existir inline)
            const inlinePolyOutlineColor = placemark.querySelector('PolyStyle > outline')?.textContent === '1' ? inlineLineColor : null;


            const point = placemark.querySelector('Point > coordinates');
            const lineString = placemark.querySelector('LineString > coordinates');
            const polygon = placemark.querySelector('Polygon > outerBoundaryIs > LinearRing > coordinates');

            // --- Processamento de Ponto (Marker) ---
            if (point) {
                const coords = point.textContent.split(',').map(Number);
                 // Validação simples das coordenadas
                if (coords.length < 2 || isNaN(coords[0]) || isNaN(coords[1])) {
                    console.warn(`Coordenadas inválidas para o ponto "${name}" em "${folderName}":`, point.textContent);
                    return; // Pula este ponto
                }
                const latLng = new google.maps.LatLng(coords[1], coords[0]);
                const markerOptions = { position: latLng, map: map, title: name };
                if (style.iconHref) {
                    markerOptions.icon = { url: style.iconHref, scaledSize: new google.maps.Size(24, 24) };
                }
                const marker = new google.maps.Marker(markerOptions);

                // *** MUDANÇA AQUI: Adiciona folderName ao InfoWindow ***
                const infoWindowContent = `<div class="custom-info-window">
                                             <strong>${folderName}</strong>
                                             <div class="point-name">${name}</div>
                                             ${description ? `<hr style="margin: 3px 0;">${description}` : ''}
                                           </div>`;
                const infoWindow = new google.maps.InfoWindow({ content: infoWindowContent });
                // *** FIM DA MUDANÇA ***

                marker.addListener('click', () => infoWindow.open(map, marker));
                bounds.extend(latLng);
            }

            // --- Processamento de Linha (Polyline) ---
            if (lineString) {
                const path = parseCoordinates(lineString.textContent);
                if (path.length > 0) {
                    routeWaypoints = path.slice();
                    const polyline = new google.maps.Polyline({
                        path: path,
                        geodesic: true,
                        strokeColor: kmlColorToCss(inlineLineColor || style.lineColor, 1), // Prioriza inline
                        strokeOpacity: 1.0,
                        strokeWeight: parseInt(inlineLineWidth || style.lineWidth || '4'), // Prioriza inline
                        map: map
                    });
                    path.forEach(p => bounds.extend(p));
                    document.getElementById('open-in-maps').classList.remove('hidden');
                }
            }

             // --- Processamento de Polígono (Polygon) ---
            if (polygon) {
                const path = parseCoordinates(polygon.textContent);
                if (path.length > 0) {
                    // Define cores padrão ou busca nos estilos/inline
                    let polyFillColor = inlinePolyColor || style.polyColor; // Prioriza inline
                    let polyStrokeColor = inlinePolyOutlineColor || inlineLineColor || style.lineColor || polyFillColor; // Várias prioridades
                    let polyStrokeWidth = parseInt(inlineLineWidth || style.lineWidth || '1');

                    // *** MUDANÇA AQUI: Estilo específico para Áreas de Risco ***
                    let finalFillOpacity = 1; // Opacidade está na cor KML por padrão
                    let finalStrokeOpacity = 1;

                    if (folderName === 'Áreas de Risco') {
                        finalFillOpacity = 0;   // Sem preenchimento (vazado)
                        polyStrokeColor = 'FF0000'; // Vermelho puro KML (sem alpha)
                        finalStrokeOpacity = 1; // Contorno opaco
                        polyStrokeWidth = 2;    // Contorno um pouco mais grosso
                        // A cor de preenchimento não importa com opacidade 0
                    }
                    // *** FIM DA MUDANÇA ***

                    const shape = new google.maps.Polygon({
                        paths: path,
                        strokeColor: kmlColorToCss(polyStrokeColor, finalStrokeOpacity), // Aplica cor e opacidade do contorno
                        strokeOpacity: 1, // A opacidade está na cor convertida
                        strokeWeight: polyStrokeWidth,
                        fillColor: kmlColorToCss(polyFillColor, 0.35), // Aplica cor de preenchimento (opacidade será ajustada)
                        fillOpacity: finalFillOpacity, // Usa a opacidade final (0 para risco, padrão KML para outros)
                        map: map
                    });
                    path.forEach(p => bounds.extend(p));
                }
            }
        }
        // --- FIM DA FUNÇÃO processPlacemark ---

        function parseCoordinates(coordsText) {
            // ...(função inalterada)...
            const pairs = coordsText.trim().split(/\s+/);
            const path = [];
            pairs.forEach(pair => {
                const coords = pair.split(',').map(Number);
                if (coords.length >= 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    path.push({ lat: coords[1], lng: coords[0] });
                }
            });
            return path;
        }

        function kmlColorToCss(kmlColor, defaultOpacity = 1) {
            // ...(função inalterada)...
            if (!kmlColor || typeof kmlColor !== 'string' || kmlColor.length !== 8) {
                // Se a cor for inválida, MAS o defaultOpacity for 0 (para risco), retorna transparente
                 if (defaultOpacity === 0) return `rgba(255,0,0,0)`; // Vermelho transparente
                 return `rgba(0,0,255,${defaultOpacity})`; // Azul padrão
            }
            try {
                // KML usa ABGR, CSS usa RGBA
                let a = parseInt(kmlColor.substring(0, 2), 16) / 255;
                const b = parseInt(kmlColor.substring(2, 4), 16);
                const g = parseInt(kmlColor.substring(4, 6), 16);
                const r = parseInt(kmlColor.substring(6, 8), 16);
                 // Se defaultOpacity for explicitamente 0, força a opacidade 0
                 if(defaultOpacity === 0) a = 0;
                 // Se não for 0, usa a opacidade do KML (ou 1 se KML não tiver opacidade definida implicitamente)
                 else a = (kmlColor.substring(0, 2) === '00' && a === 0) ? 1 : a; // Hack para cores KML sem alfa (como FF0000)

                return `rgba(${r}, ${g}, ${b}, ${a})`;
            } catch (e) {
                console.error("Erro ao converter cor KML:", kmlColor, e);
                 if (defaultOpacity === 0) return `rgba(255,0,0,0)`;
                 return `rgba(0,0,255,${defaultOpacity})`;
            }
        }

        function showKmlInfo(kmlDoc) {
             // ...(função inalterada)...
            const name = kmlDoc.querySelector('Document > name')?.textContent || 'Rotograma';
            document.getElementById('info-content').innerHTML = `<strong>${name}</strong>`;
            document.getElementById('info-panel').classList.remove('hidden');
        }

        function createLegend(kmlDoc) {
             // ...(função inalterada, já correta da vez anterior)...
            const legendDiv = document.getElementById('legend');
            let legendHTML = '<h6>Legenda</h6>';
            const addedIcons = new Set();
            const styles = extractStyles(kmlDoc);
            const kmlFolders = kmlDoc.querySelectorAll('Document > Folder');

            kmlFolders.forEach(folder => {
                const firstPlacemarkWithPoint = folder.querySelector('Placemark > Point');
                if (!firstPlacemarkWithPoint) return;
                const placemark = firstPlacemarkWithPoint.closest('Placemark');
                if (!placemark) return;

                const folderName = folder.querySelector('name')?.textContent || 'Tipo Desconhecido';
                const styleUrl = placemark.querySelector('styleUrl')?.textContent;

                if (styleUrl && styles[styleUrl] && styles[styleUrl].iconHref) {
                    const iconHref = styles[styleUrl].iconHref;
                    if (!addedIcons.has(iconHref)) {
                        legendHTML += `<div class="legend-item">
                                         <img src="${iconHref}" class="legend-icon" alt="${folderName}">
                                         <span>${folderName}</span>
                                       </div>`;
                        addedIcons.add(iconHref);
                    }
                }
            });

            if (addedIcons.size > 0) {
                legendDiv.innerHTML = legendHTML;
                legendDiv.classList.remove('hidden');
            } else {
                 legendDiv.classList.add('hidden');
            }
        }

        function showError(message) {
             // ...(função inalterada)...
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('map').innerHTML = `<div style="text-align: center; padding: 50px; font-size: 18px; color: red;">${message}</div>`;
        }

        function openRouteInGoogleMaps() {
             // ...(função inalterada)...
             if (routeWaypoints.length < 2) { alert("A rota precisa de pelo menos dois pontos."); return; }
             const origin = `${routeWaypoints[0].lat},${routeWaypoints[0].lng}`;
             const destination = `${routeWaypoints[routeWaypoints.length - 1].lat},${routeWaypoints[routeWaypoints.length - 1].lng}`;
             const waypoints = routeWaypoints.slice(1, -1).map(p => `${p.lat},${p.lng}`).join('|');
             let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
             if (waypoints) { url += `&waypoints=${waypoints}`; }
             window.open(url, '_blank');
        }

    </script>
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCmDbEaw8opef4jzcAZePv3GFdkxDmC9tk&callback=initMap">
    </script>
</body>
</html>
