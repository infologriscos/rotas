<!DOCTYPE html>
<html>
<head>
    <title>Visualizador de Rotograma</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <style>
        /* Estilos CSS */
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); z-index: 1000; }
        .hidden { display: none; }
        #info-panel { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); max-width: 300px; z-index: 1000; }
        
        /* Estilos para o balão de informação */
        .custom-info-window { max-width: 250px; line-height: 1.4; }
        .custom-info-window strong { display: block; margin-bottom: 3px; font-size: 1.1em; color: #333; } /* Título Categoria */
        .custom-info-window .point-name { font-weight: bold; color: #555;} /* Nome do Ponto */
        
        /* Estilos para a legenda */
        #legend { position: absolute; bottom: 30px; left: 10px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); z-index: 1000; font-size: 12px; max-height: 40%; overflow-y: auto;}
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .legend-icon { width: 24px; height: 24px; margin-right: 8px; object-fit: contain;}
        
        /* Ícones geométricos CSS para legenda (Risco/Jammer) - ALTERADO PARA CÍRCULO */
        .legend-color-box { width: 18px; height: 18px; margin-right: 8px; border: 3px solid; border-radius: 50%; display: inline-block; background: transparent; }
        
        #legend h6 { margin-top: 0; margin-bottom: 8px; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="loading">Carregando Rotograma...</div>
    <div id="info-panel" class="hidden">
        <div id="info-content"></div>
    </div>
    <div id="legend" class="hidden"><h6>Legenda</h6></div>

    <script>
        // Variáveis globais
        let map;
        let routeWaypoints = [];
        let kmlDocumentGlobal = null;

        function initMap() {
            const urlParams = new URLSearchParams(window.location.search);
            const kmlUrl = urlParams.get('kml');

            if (!kmlUrl) {
                showError('Erro: Nenhuma URL de KML foi fornecida.');
                return;
            }

            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 4, center: { lat: -14.235, lng: -51.925 }, mapTypeControl: false, streetViewControl: false
            });

            loadKml(kmlUrl, map);
        }

        function loadKml(kmlUrl, map) {
            const loadingDiv = document.getElementById('loading');
            loadingDiv.classList.remove('hidden');

            fetch(kmlUrl)
                .then(response => {
                    if (!response.ok) { throw new Error(`HTTP error! status: ${response.status}`); }
                    return response.text();
                })
                .then(kmlText => {
                    kmlDocumentGlobal = processKml(kmlText, map);
                    if (kmlDocumentGlobal) { createLegend(kmlDocumentGlobal); }
                    loadingDiv.classList.add('hidden');
                })
                .catch(error => {
                    console.error('Erro ao carregar ou processar KML:', error);
                    showError(`Erro ao carregar KML: ${error.message}. Verifique a URL e a conexão.`);
                });
        }

        function processKml(kmlText, map) {
            const parser = new DOMParser();
            const kmlDoc = parser.parseFromString(kmlText, 'text/xml');

            if (kmlDoc.getElementsByTagName("parsererror").length > 0) {
                console.error("Erro de parse KML:", kmlDoc.getElementsByTagName("parsererror")[0].textContent);
                showError('Erro ao processar o KML. Verifique se o arquivo é um XML válido.');
                return null;
            }

            const styles = extractStyles(kmlDoc);
            const bounds = new google.maps.LatLngBounds();
            routeWaypoints = [];

            // Iterar por Pastas (Folders) primeiro
            const kmlFolders = kmlDoc.querySelectorAll('Document > Folder');
            kmlFolders.forEach(folder => {
                const folderName = folder.querySelector('name')?.textContent || 'Sem Categoria';
                const placemarksInFolder = folder.querySelectorAll('Placemark');

                placemarksInFolder.forEach(placemark => {
                    // Passa o nome da pasta para processPlacemark
                    processPlacemark(placemark, folderName, styles, map, bounds);
                });
            });

            if (!bounds.isEmpty()) {
                map.fitBounds(bounds);
            } else {
                 console.warn("Nenhum elemento KML encontrado para ajustar limites do mapa.");
                 map.setCenter({ lat: -14.235, lng: -51.925 });
                 map.setZoom(4);
            }

            showKmlInfo(kmlDoc);
            return kmlDoc;
        }


        function extractStyles(kmlDoc) {
            const styles = {};
            // Tenta buscar StyleMap primeiro
            const styleMapElements = kmlDoc.getElementsByTagName('StyleMap');
            for (let i = 0; i < styleMapElements.length; i++) {
                const id = '#' + styleMapElements[i].getAttribute('id');
                if (id) {
                    const normalStyleUrl = styleMapElements[i].querySelector('Pair > key:contains("normal") + styleUrl')?.textContent;
                    if (normalStyleUrl) {
                         const normalStyle = kmlDoc.querySelector(`Style[id="${normalStyleUrl.substring(1)}"]`);
                         if (normalStyle) {
                             const iconHref = normalStyle.querySelector('IconStyle > Icon > href')?.textContent;
                             // Adiciona também cores/largura do Style normal para referência futura
                             const lineColor = normalStyle.querySelector('LineStyle > color')?.textContent;
                             const lineWidth = normalStyle.querySelector('LineStyle > width')?.textContent;
                             const polyColor = normalStyle.querySelector('PolyStyle > color')?.textContent;
                             styles[id] = { iconHref: iconHref || null, lineColor, lineWidth, polyColor };
                         }
                    }
                }
            }
            // Busca Styles simples
            const styleElements = kmlDoc.getElementsByTagName('Style');
            for (let i = 0; i < styleElements.length; i++) {
                const id = '#' + styleElements[i].getAttribute('id');
                if (id && !styles[id]) { // Só adiciona se não foi pego pelo StyleMap
                    const iconHref = styleElements[i].querySelector('IconStyle > Icon > href')?.textContent;
                    const lineColor = styleElements[i].querySelector('LineStyle > color')?.textContent;
                    const lineWidth = styleElements[i].querySelector('LineStyle > width')?.textContent;
                    const polyColor = styleElements[i].querySelector('PolyStyle > color')?.textContent;
                    // Adiciona mesmo se não tiver ícone, pois pode ser estilo de linha/polígono
                    styles[id] = { iconHref, lineColor, lineWidth, polyColor };
                }
            }
            return styles;
        }

        // Adicionado parâmetro folderName
        function processPlacemark(placemark, folderName, styles, map, bounds) {
            const name = placemark.querySelector('name')?.textContent || '';
            const description = placemark.querySelector('description')?.textContent || '';
            const styleUrl = placemark.querySelector('styleUrl')?.textContent || '';
            const style = styles[styleUrl] || {}; // Estilo referenciado

            // Cores e larguras que podem ser definidas inline no Placemark
            const inlineLineColor = placemark.querySelector('LineStyle > color')?.textContent;
            const inlineLineWidth = placemark.querySelector('LineStyle > width')?.textContent;
            const inlinePolyColor = placemark.querySelector('PolyStyle > color')?.textContent;
            const inlinePolyOutline = placemark.querySelector('PolyStyle > outline')?.textContent; // '1' ou '0'
            const inlinePolyFill = placemark.querySelector('PolyStyle > fill')?.textContent; // '1' ou '0'


            const point = placemark.querySelector('Point > coordinates');
            const lineString = placemark.querySelector('LineString > coordinates');
            const polygon = placemark.querySelector('Polygon > outerBoundaryIs > LinearRing > coordinates');

            // --- Processamento de Ponto (Marker) ---
            if (point) {
                const coords = point.textContent.split(',').map(Number);
                if (coords.length < 2 || isNaN(coords[0]) || isNaN(coords[1])) {
                    console.warn(`Coordenadas inválidas para o ponto "${name}" em "${folderName}":`, point.textContent);
                    return;
                }
                const latLng = new google.maps.LatLng(coords[1], coords[0]);
                const markerOptions = { position: latLng, map: map, title: name };
                if (style.iconHref) {
                    markerOptions.icon = { url: style.iconHref, scaledSize: new google.maps.Size(24, 24) };
                }
                const marker = new google.maps.Marker(markerOptions);

                // Adiciona folderName ao InfoWindow
                const infoWindowContent = `<div class="custom-info-window">
                                                <strong>${folderName}</strong>
                                                <div class="point-name">${name}</div>
                                                ${description ? `<hr style="margin: 3px 0;">${description}` : ''}
                                              </div>`;
                const infoWindow = new google.maps.InfoWindow({ content: infoWindowContent });
                marker.addListener('click', () => infoWindow.open(map, marker));
                bounds.extend(latLng);
            }

            // --- Processamento de Linha (Polyline) ---
            if (lineString) {
                const path = parseCoordinates(lineString.textContent);
                if (path.length > 0) {
                    routeWaypoints = path.slice();
                    const polyline = new google.maps.Polyline({
                        path: path,
                        geodesic: true,
                        strokeColor: kmlColorToCss(inlineLineColor || style.lineColor), // Prioriza inline
                        strokeOpacity: 1.0, // Opacidade está na cor KML
                        strokeWeight: parseInt(inlineLineWidth || style.lineWidth || '4'), // Prioriza inline
                        map: map
                    });
                    path.forEach(p => bounds.extend(p));
                    // REMOVIDO: Botão de abrir no Google Maps
                }
            }

             // --- Processamento de Polígono (Polygon) ---
            if (polygon) {
                const path = parseCoordinates(polygon.textContent);
                 if (path.length > 0) {
                    // Define cores e estilos padrão ou busca nos estilos/inline
                    let polyFillColorKML = inlinePolyColor || style.polyColor; // Prioriza inline
                    let polyStrokeColorKML = inlineLineColor || style.lineColor || (inlinePolyOutline === '1' || style.polyOutline === '1' ? polyFillColorKML : null);
                    let polyStrokeWidth = parseInt(inlineLineWidth || style.lineWidth || '1');
                    let polyFill = inlinePolyFill !== '0';
                    let polyOutline = inlinePolyOutline !== '0';

                    // ESTILO ESPECÍFICO PARA ÁREAS DE RISCO
                    let isAreaDeRisco = (folderName === 'Áreas de Risco');
                    // ESTILO ESPECÍFICO PARA ÁREAS DE JAMMER
                    let isAreaDeJammer = (folderName === 'Áreas de Jammer' || folderName === 'Presídios');

                    const polygonOptions = {
                        paths: path,
                        strokeColor: kmlColorToCss(polyStrokeColorKML, 1, isAreaDeRisco), // Passa flag para forçar vermelho
                        strokeOpacity: 1, // Opacidade na cor convertida
                        strokeWeight: isAreaDeRisco ? 2 : (isAreaDeJammer ? 2 : polyStrokeWidth), 
                        fillColor: kmlColorToCss(polyFillColorKML, 0.35), // Opacidade padrão baixa no preenchimento
                        fillOpacity: isAreaDeRisco || isAreaDeJammer ? 0 : (polyFill ? 1 : 0), // Vazado para risco/jammer ou se fill=0
                        map: map
                    };

                    if (!polyOutline && !isAreaDeRisco && !isAreaDeJammer) {
                         polygonOptions.strokeWeight = 0;
                         polygonOptions.strokeOpacity = 0;
                    }

                    const shape = new google.maps.Polygon(polygonOptions);

                    // --- ADICIONADO: InfoWindow para Polígonos ---
                    if (shape) { // Garante que o polígono foi criado
                        // Usa o nome da pasta e o nome do Placemark (que deve ser Cidade, Estado)
                        const infoWindowContent = `<div class="custom-info-window">
                                                      <strong>${folderName}</strong>
                                                      <div class="point-name">${name}</div>
                                                      ${description ? `<hr style="margin: 3px 0;">${description}` : ''}
                                                    </div>`;
                        const infoWindow = new google.maps.InfoWindow({ content: infoWindowContent });

                        // Adiciona um listener de clique ao polígono
                        google.maps.event.addListener(shape, 'click', function(event) {
                            // Define a posição do InfoWindow para onde o usuário clicou dentro do polígono
                            infoWindow.setPosition(event.latLng);
                            infoWindow.open(map); // Abre no mapa (não associado a um marcador)
                        });
                    }

                    path.forEach(p => bounds.extend(p));
                }
            }
        }


        function parseCoordinates(coordsText) {
            // ...(função inalterada)...
            const pairs = coordsText.trim().split(/\s+/);
            const path = [];
            pairs.forEach(pair => {
                const coords = pair.split(',').map(Number);
                if (coords.length >= 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    path.push({ lat: coords[1], lng: coords[0] });
                }
            });
            return path;
        }

        // --- FUNÇÃO kmlColorToCss ---
        function kmlColorToCss(kmlColor, defaultOpacity = 1, forceRedOutline = false) { // Novo parâmetro forceRedOutline
            // KML usa ABGR (Alpha, Blue, Green, Red), CSS usa RGBA

            // Se for para forçar contorno vermelho (Áreas de Risco)
            if (forceRedOutline) {
                return `rgba(255, 0, 0, ${defaultOpacity})`; // Vermelho puro com a opacidade desejada
            }

            // Se a cor KML for inválida ou ausente
            if (!kmlColor || typeof kmlColor !== 'string' || kmlColor.length !== 8) {
                 if (defaultOpacity === 0) return `rgba(255,0,0,0)`; // Transparente se opacidade for 0
                 return `rgba(0,0,255,${defaultOpacity})`; // Azul padrão caso contrário
            }
            try {
                let a = parseInt(kmlColor.substring(0, 2), 16) / 255; // Alpha
                const b = parseInt(kmlColor.substring(2, 4), 16); // Blue
                const g = parseInt(kmlColor.substring(4, 6), 16); // Green
                const r = parseInt(kmlColor.substring(6, 8), 16); // Red

                // Usa defaultOpacity SE a opacidade KML for 00 (totalmente transparente),
                // OU se a opacidade desejada (defaultOpacity) for explicitamente 0.
                if (kmlColor.substring(0, 2) === '00' || defaultOpacity === 0) {
                     a = defaultOpacity;
                }
                // Garante opacidade 1 se o KML não especificar alpha (ex: só FF0000)
                else if (a === 0 && kmlColor.substring(0,2) !== '00') {
                    a = 1;
                }


                return `rgba(${r}, ${g}, ${b}, ${a})`;
            } catch (e) {
                console.error("Erro ao converter cor KML:", kmlColor, e);
                 if (defaultOpacity === 0) return `rgba(255,0,0,0)`;
                 return `rgba(0,0,255,${defaultOpacity})`;
            }
        }
        // --- FIM DA FUNÇÃO kmlColorToCss ---

        function showKmlInfo(kmlDoc) {
             // ...(função inalterada)...
            const name = kmlDoc.querySelector('Document > name')?.textContent || 'Rotograma';
            document.getElementById('info-content').innerHTML = `<strong>${name}</strong>`;
            document.getElementById('info-panel').classList.remove('hidden');
        }

        // --- FUNÇÃO DA LEGENDA ATUALIZADA ---
        function createLegend(kmlDoc) {
            const legendDiv = document.getElementById('legend');
            let legendHTML = '<h6>Legenda</h6>'; 
            const legendItems = {}; // Usar objeto para evitar duplicatas por nome de pasta
            let hasItems = false;

            const styles = extractStyles(kmlDoc);
            const kmlFolders = kmlDoc.querySelectorAll('Document > Folder');

            kmlFolders.forEach(folder => {
                const folderName = folder.querySelector('name')?.textContent || 'Outros';
                
                // Ignora pastas de estrutura interna do KML que não sejam dados (ex: Origem/Destino/Trajeto se não quiser na legenda)
                // MODIFICADO: Remove "Trajeto" da legenda conforme pedido
                if (folderName === 'Trajeto' || folderName === 'Origem' || folderName === 'Destino') return;

                // Tenta achar um ícone dentro da pasta
                let iconUrl = null;
                let isGeometry = false;
                let geometryColor = 'gray'; // Cor padrão para geometria

                // 1. Procura Placemarks com Ponto (Ícones)
                const placemarkPoint = folder.querySelector('Placemark > Point');
                if (placemarkPoint) {
                    const pm = placemarkPoint.closest('Placemark');
                    const styleUrl = pm.querySelector('styleUrl')?.textContent;
                    if (styleUrl && styles[styleUrl] && styles[styleUrl].iconHref) {
                        iconUrl = styles[styleUrl].iconHref;
                    } else {
                        // Ícone padrão Google se não tiver estilo definido
                        iconUrl = 'https://maps.google.com/mapfiles/ms/icons/red-dot.png'; 
                    }
                } 
                // 2. Se não achou ponto, procura Polígonos (Áreas)
                else {
                    const placemarkPoly = folder.querySelector('Placemark > Polygon') || folder.querySelector('Placemark > LineString'); // Considera linha tb
                    if (placemarkPoly) {
                        isGeometry = true;
                        if (folderName === 'Áreas de Risco') geometryColor = 'red';
                        else if (folderName === 'Áreas de Jammer' || folderName === 'Presídios') geometryColor = 'gray';
                        else if (folderName === 'Trajeto') geometryColor = 'blue';
                        else geometryColor = 'black'; // Default
                    }
                }

                // Adiciona ao objeto de itens da legenda se tivermos algo para mostrar
                if (iconUrl || isGeometry) {
                    legendItems[folderName] = { icon: iconUrl, isGeometry: isGeometry, color: geometryColor };
                    hasItems = true;
                }
            });

            // Constrói o HTML
            for (const [name, data] of Object.entries(legendItems)) {
                let iconHTML = '';
                if (data.isGeometry) {
                    // Cria um quadrado colorido para representar a área/linha
                    iconHTML = `<span class="legend-color-box" style="border-color: ${data.color};"></span>`;
                } else {
                    iconHTML = `<img src="${data.icon}" class="legend-icon" alt="${name}">`;
                }
                
                legendHTML += `<div class="legend-item">
                                ${iconHTML}
                                <span>${name}</span>
                               </div>`;
            }

            if (hasItems) {
                legendDiv.innerHTML = legendHTML;
                legendDiv.classList.remove('hidden');
            } else {
                legendDiv.classList.add('hidden');
            }
        }
        
        function showError(message) {
             // ...(função inalterada)...
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('map').innerHTML = `<div style="text-align: center; padding: 50px; font-size: 18px; color: red;">${message}</div>`;
        }

    </script>
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCmDbEaw8opef4jzcAZePv3GFdkxDmC9tk&callback=initMap">
    </script>
</body>
</html>
