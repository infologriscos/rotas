<!DOCTYPE html>
<html>
<head>
    <title>Visualizador de Rotograma GPS</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <style>
        /* Estilos CSS */
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); z-index: 1000; }
        .hidden { display: none; }
        #info-panel { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); max-width: 300px; z-index: 1000; }
        
        /* Estilos para o balão de informação */
        .custom-info-window { max-width: 250px; line-height: 1.4; }
        .custom-info-window strong { display: block; margin-bottom: 3px; font-size: 1.1em; color: #333; }
        .custom-info-window .point-name { font-weight: bold; color: #555;}
        
        /* Estilos para a legenda */
        #legend { position: absolute; bottom: 30px; left: 10px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2); z-index: 1000; font-size: 12px; max-height: 40%; overflow-y: auto;}
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .legend-icon { width: 24px; height: 24px; margin-right: 8px; object-fit: contain;}
        .legend-color-box { width: 18px; height: 18px; margin-right: 8px; border: 3px solid; border-radius: 50%; display: inline-block; background: transparent; }
        #legend h6 { margin-top: 0; margin-bottom: 8px; font-weight: bold; font-size: 13px; }

        /* --- Estilo do Botão de GPS --- */
        .custom-map-control-button {
            background-color: #fff;
            border: 0;
            border-radius: 2px;
            box-shadow: 0 1px 4px -1px rgba(0,0,0,0.3);
            margin: 10px;
            padding: 0;
            position: absolute;
            cursor: pointer;
            width: 40px;
            height: 40px;
            overflow: hidden;
            top: 10px; 
            right: 10px; /* Canto superior direito */
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .custom-map-control-button:hover { background-color: #ebebeb; }
        .gps-icon-svg { width: 24px; height: 24px; fill: #666; }
        .gps-active .gps-icon-svg { fill: #4285F4; } /* Azul quando ativo */
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="loading">Carregando Rotograma...</div>
    <div id="info-panel" class="hidden">
        <div id="info-content"></div>
    </div>
    <div id="legend" class="hidden"><h6>Legenda</h6></div>

    <script>
        // Variáveis globais
        let map;
        let routeWaypoints = [];
        let kmlDocumentGlobal = null;
        
        // --- VARIÁVEIS PARA NAVEGAÇÃO ---
        let userMarker = null;
        let watchId = null;
        let isTracking = false;

        function initMap() {
            const urlParams = new URLSearchParams(window.location.search);
            const kmlUrl = urlParams.get('kml');

            if (!kmlUrl) {
                showError('Erro: Nenhuma URL de KML foi fornecida.');
                return;
            }

            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 4, 
                center: { lat: -14.235, lng: -51.925 }, 
                mapTypeControl: false, 
                streetViewControl: false,
                fullscreenControl: false
            });

            // Adiciona o botão de localização
            addYourLocationButton(map);

            loadKml(kmlUrl, map);
        }

        // --- Cria o botão e a lógica de GPS ---
        function addYourLocationButton(map) {
            const controlDiv = document.createElement("div");
            controlDiv.className = "custom-map-control-button";
            controlDiv.title = "Onde estou?";
            
            // Ícone de mira (Target)
            controlDiv.innerHTML = `
                <svg class="gps-icon-svg" viewBox="0 0 24 24">
                    <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7-7 7z"/>
                </svg>
            `;

            map.controls[google.maps.ControlPosition.RIGHT_TOP].push(controlDiv);

            controlDiv.addEventListener("click", () => {
                if (navigator.geolocation) {
                    toggleTracking(map, controlDiv);
                } else {
                    alert("Seu navegador não suporta geolocalização.");
                }
            });
        }

        // --- Liga/Desliga o rastreamento ---
        function toggleTracking(map, button) {
            if (isTracking) {
                // --- PARAR RASTREAMENTO ---
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                isTracking = false;
                button.classList.remove("gps-active");
            } else {
                // --- INICIAR RASTREAMENTO ---
                if (typeof requestWakeLock === "function") {
                    requestWakeLock(); 
                }

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const pos = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                        };

                        if (!userMarker) {
                            userMarker = new google.maps.Marker({
                                position: pos,
                                map: map,
                                title: "Você está aqui",
                                icon: {
                                    path: google.maps.SymbolPath.CIRCLE,
                                    scale: 8,
                                    fillColor: "#4285F4",
                                    fillOpacity: 1,
                                    strokeColor: "white",
                                    strokeWeight: 2,
                                },
                                zIndex: 9999
                            });
                            
                            new google.maps.Circle({
                                strokeColor: "#4285F4",
                                strokeOpacity: 0.3,
                                strokeWeight: 1,
                                fillColor: "#4285F4",
                                fillOpacity: 0.1,
                                map: map,
                                center: pos,
                                radius: position.coords.accuracy,
                            });
                        } else {
                            userMarker.setPosition(pos);
                        }

                        map.setCenter(pos);
                        if (map.getZoom() < 14) {
                            map.setZoom(15);
                        }

                        isTracking = true;
                        button.classList.add("gps-active");
                    },
                    (error) => {
                        if (error.code === 3) {
                            console.warn("GPS Timeout. Aguardando sinal...");
                            return; 
                        }
                        handleLocationError(true, map.getCenter());
                        button.classList.remove("gps-active");
                        isTracking = false;
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 5000,
                        timeout: 30000
                    }
                );
            }
        }

        function handleLocationError(browserHasGeolocation, pos) {
            alert(
                browserHasGeolocation
                    ? "Erro: O serviço de geolocalização falhou (Verifique se o GPS está ativo e se o site é HTTPS)."
                    : "Erro: Seu navegador não suporta geolocalização."
            );
        }

        function loadKml(kmlUrl, map) {
            const loadingDiv = document.getElementById('loading');
            loadingDiv.classList.remove('hidden');

            fetch(kmlUrl)
                .then(response => {
                    if (!response.ok) { throw new Error(`HTTP error! status: ${response.status}`); }
                    return response.text();
                })
                .then(kmlText => {
                    kmlDocumentGlobal = processKml(kmlText, map);
                    if (kmlDocumentGlobal) { createLegend(kmlDocumentGlobal); }
                    loadingDiv.classList.add('hidden');
                })
                .catch(error => {
                    console.error('Erro ao carregar ou processar KML:', error);
                    showError(`Erro ao carregar KML: ${error.message}. Verifique a URL e a conexão.`);
                });
        }

        function processKml(kmlText, map) {
            const parser = new DOMParser();
            const kmlDoc = parser.parseFromString(kmlText, 'text/xml');

            if (kmlDoc.getElementsByTagName("parsererror").length > 0) {
                console.error("Erro de parse KML:", kmlDoc.getElementsByTagName("parsererror")[0].textContent);
                showError('Erro ao processar o KML. Verifique se o arquivo é um XML válido.');
                return null;
            }

            const styles = extractStyles(kmlDoc);
            const bounds = new google.maps.LatLngBounds();
            routeWaypoints = [];

            const kmlFolders = kmlDoc.querySelectorAll('Document > Folder');
            kmlFolders.forEach(folder => {
                const folderName = folder.querySelector('name')?.textContent || 'Sem Categoria';
                const placemarksInFolder = folder.querySelectorAll('Placemark');

                placemarksInFolder.forEach(placemark => {
                    processPlacemark(placemark, folderName, styles, map, bounds);
                });
            });

            if (!bounds.isEmpty()) {
                map.fitBounds(bounds);
            } else {
                 console.warn("Nenhum elemento KML encontrado para ajustar limites do mapa.");
                 map.setCenter({ lat: -14.235, lng: -51.925 });
                 map.setZoom(4);
            }

            showKmlInfo(kmlDoc);
            return kmlDoc;
        }

        function extractStyles(kmlDoc) {
            const styles = {};
            const styleMapElements = kmlDoc.getElementsByTagName('StyleMap');
            for (let i = 0; i < styleMapElements.length; i++) {
                const id = '#' + styleMapElements[i].getAttribute('id');
                if (id) {
                    const normalStyleUrl = styleMapElements[i].querySelector('Pair > key:contains("normal") + styleUrl')?.textContent;
                    if (normalStyleUrl) {
                         const normalStyle = kmlDoc.querySelector(`Style[id="${normalStyleUrl.substring(1)}"]`);
                         if (normalStyle) {
                             const iconHref = normalStyle.querySelector('IconStyle > Icon > href')?.textContent;
                             const lineColor = normalStyle.querySelector('LineStyle > color')?.textContent;
                             const lineWidth = normalStyle.querySelector('LineStyle > width')?.textContent;
                             const polyColor = normalStyle.querySelector('PolyStyle > color')?.textContent;
                             styles[id] = { iconHref: iconHref || null, lineColor, lineWidth, polyColor };
                         }
                    }
                }
            }
            const styleElements = kmlDoc.getElementsByTagName('Style');
            for (let i = 0; i < styleElements.length; i++) {
                const id = '#' + styleElements[i].getAttribute('id');
                if (id && !styles[id]) {
                    const iconHref = styleElements[i].querySelector('IconStyle > Icon > href')?.textContent;
                    const lineColor = styleElements[i].querySelector('LineStyle > color')?.textContent;
                    const lineWidth = styleElements[i].querySelector('LineStyle > width')?.textContent;
                    const polyColor = styleElements[i].querySelector('PolyStyle > color')?.textContent;
                    styles[id] = { iconHref, lineColor, lineWidth, polyColor };
                }
            }
            return styles;
        }

        function processPlacemark(placemark, folderName, styles, map, bounds) {
            const name = placemark.querySelector('name')?.textContent || '';
            const description = placemark.querySelector('description')?.textContent || '';
            const styleUrl = placemark.querySelector('styleUrl')?.textContent || '';
            const style = styles[styleUrl] || {};

            const inlineLineColor = placemark.querySelector('LineStyle > color')?.textContent;
            const inlineLineWidth = placemark.querySelector('LineStyle > width')?.textContent;
            const inlinePolyColor = placemark.querySelector('PolyStyle > color')?.textContent;
            const inlinePolyOutline = placemark.querySelector('PolyStyle > outline')?.textContent;
            const inlinePolyFill = placemark.querySelector('PolyStyle > fill')?.textContent;

            const point = placemark.querySelector('Point > coordinates');
            const lineString = placemark.querySelector('LineString > coordinates');
            const polygon = placemark.querySelector('Polygon > outerBoundaryIs > LinearRing > coordinates');

            if (point) {
                const coords = point.textContent.split(',').map(Number);
                if (coords.length < 2 || isNaN(coords[0]) || isNaN(coords[1])) { return; }
                const latLng = new google.maps.LatLng(coords[1], coords[0]);
                const markerOptions = { position: latLng, map: map, title: name };
                if (style.iconHref) {
                    markerOptions.icon = { url: style.iconHref, scaledSize: new google.maps.Size(24, 24) };
                }
                const marker = new google.maps.Marker(markerOptions);
                const infoWindowContent = `<div class="custom-info-window"><strong>${folderName}</strong><div class="point-name">${name}</div>${description ? `<hr style="margin: 3px 0;">${description}` : ''}</div>`;
                const infoWindow = new google.maps.InfoWindow({ content: infoWindowContent });
                marker.addListener('click', () => infoWindow.open(map, marker));
                bounds.extend(latLng);
            }

            if (lineString) {
                const path = parseCoordinates(lineString.textContent);
                if (path.length > 0) {
                    routeWaypoints = path.slice();
                    new google.maps.Polyline({
                        path: path, geodesic: true,
                        strokeColor: kmlColorToCss(inlineLineColor || style.lineColor),
                        strokeOpacity: 1.0,
                        strokeWeight: parseInt(inlineLineWidth || style.lineWidth || '4'),
                        map: map
                    });
                    path.forEach(p => bounds.extend(p));
                }
            }

            if (polygon) {
                const path = parseCoordinates(polygon.textContent);
                 if (path.length > 0) {
                    let polyFillColorKML = inlinePolyColor || style.polyColor;
                    let polyStrokeColorKML = inlineLineColor || style.lineColor || (inlinePolyOutline === '1' || style.polyOutline === '1' ? polyFillColorKML : null);
                    let polyStrokeWidth = parseInt(inlineLineWidth || style.lineWidth || '1');
                    let polyFill = inlinePolyFill !== '0';
                    let polyOutline = inlinePolyOutline !== '0';
                    let isAreaDeRisco = (folderName === 'Áreas de Risco');
                    let isAreaDeJammer = (folderName === 'Áreas de Jammer' || folderName === 'Presídios');

                    const polygonOptions = {
                        paths: path,
                        strokeColor: kmlColorToCss(polyStrokeColorKML, 1, isAreaDeRisco),
                        strokeOpacity: 1,
                        strokeWeight: isAreaDeRisco ? 2 : (isAreaDeJammer ? 2 : polyStrokeWidth), 
                        fillColor: kmlColorToCss(polyFillColorKML, 0.35),
                        fillOpacity: isAreaDeRisco || isAreaDeJammer ? 0 : (polyFill ? 1 : 0),
                        map: map
                    };
                    if (!polyOutline && !isAreaDeRisco && !isAreaDeJammer) {
                         polygonOptions.strokeWeight = 0; polygonOptions.strokeOpacity = 0;
                    }
                    const shape = new google.maps.Polygon(polygonOptions);
                    if (shape) {
                        const infoWindowContent = `<div class="custom-info-window"><strong>${folderName}</strong><div class="point-name">${name}</div>${description ? `<hr style="margin: 3px 0;">${description}` : ''}</div>`;
                        const infoWindow = new google.maps.InfoWindow({ content: infoWindowContent });
                        google.maps.event.addListener(shape, 'click', function(event) {
                            infoWindow.setPosition(event.latLng);
                            infoWindow.open(map);
                        });
                    }
                    path.forEach(p => bounds.extend(p));
                }
            }
        }

        function parseCoordinates(coordsText) {
            const pairs = coordsText.trim().split(/\s+/);
            const path = [];
            pairs.forEach(pair => {
                const coords = pair.split(',').map(Number);
                if (coords.length >= 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    path.push({ lat: coords[1], lng: coords[0] });
                }
            });
            return path;
        }

        function kmlColorToCss(kmlColor, defaultOpacity = 1, forceRedOutline = false) {
            if (forceRedOutline) { return `rgba(255, 0, 0, ${defaultOpacity})`; }
            if (!kmlColor || typeof kmlColor !== 'string' || kmlColor.length !== 8) {
                 if (defaultOpacity === 0) return `rgba(255,0,0,0)`;
                 return `rgba(0,0,255,${defaultOpacity})`;
            }
            try {
                let a = parseInt(kmlColor.substring(0, 2), 16) / 255;
                const b = parseInt(kmlColor.substring(2, 4), 16);
                const g = parseInt(kmlColor.substring(4, 6), 16);
                const r = parseInt(kmlColor.substring(6, 8), 16);
                if (kmlColor.substring(0, 2) === '00' || defaultOpacity === 0) { a = defaultOpacity; }
                else if (a === 0 && kmlColor.substring(0,2) !== '00') { a = 1; }
                return `rgba(${r}, ${g}, ${b}, ${a})`;
            } catch (e) {
                 if (defaultOpacity === 0) return `rgba(255,0,0,0)`;
                 return `rgba(0,0,255,${defaultOpacity})`;
            }
        }

        function showKmlInfo(kmlDoc) {
            const name = kmlDoc.querySelector('Document > name')?.textContent || 'Rotograma';
            document.getElementById('info-content').innerHTML = `<strong>${name}</strong>`;
            document.getElementById('info-panel').classList.remove('hidden');
        }

        // --- FUNÇÃO ATUALIZADA: Conta os pontos e exibe na legenda ---
        function createLegend(kmlDoc) {
            const legendDiv = document.getElementById('legend');
            let legendHTML = '<h6>Legenda</h6>'; 
            const legendItems = {}; // Armazena por Nome da Pasta
            let hasItems = false;
            const styles = extractStyles(kmlDoc);
            const kmlFolders = kmlDoc.querySelectorAll('Document > Folder');

            kmlFolders.forEach(folder => {
                const folderName = folder.querySelector('name')?.textContent || 'Outros';
                
                // Filtra pastas de navegação/estruturais
                if (folderName === 'Trajeto' || folderName === 'Origem' || folderName === 'Destino') return;

                // Inicializa o objeto para esta pasta se ainda não existir
                if (!legendItems[folderName]) {
                    legendItems[folderName] = { icon: null, isGeometry: false, color: 'gray', count: 0 };
                }

                // Conta quantos placemarks válidos existem nesta pasta
                const placemarks = folder.querySelectorAll('Placemark');
                
                placemarks.forEach(pm => {
                    // Verifica se é um objeto de mapa válido
                    const isPoint = pm.querySelector('Point');
                    const isPoly = pm.querySelector('Polygon');
                    const isLine = pm.querySelector('LineString');

                    if (isPoint || isPoly || isLine) {
                        legendItems[folderName].count++; // Incrementa contagem
                        hasItems = true;

                        // Tenta capturar o ícone ou estilo (prioriza o primeiro encontrado na pasta)
                        if (!legendItems[folderName].icon && !legendItems[folderName].isGeometry) {
                            if (isPoint) {
                                const styleUrl = pm.querySelector('styleUrl')?.textContent;
                                if (styleUrl && styles[styleUrl] && styles[styleUrl].iconHref) {
                                    legendItems[folderName].icon = styles[styleUrl].iconHref;
                                } else {
                                    // Ícone padrão fallback
                                    legendItems[folderName].icon = 'http://maps.google.com/mapfiles/kml/pushpin/ylw-pushpin.png';
                                }
                            } else {
                                // É geometria
                                legendItems[folderName].isGeometry = true;
                                if (folderName === 'Áreas de Risco') legendItems[folderName].color = 'red';
                                else if (folderName === 'Áreas de Jammer' || folderName === 'Presídios') legendItems[folderName].color = 'gray';
                                else if (folderName === 'Trajeto') legendItems[folderName].color = 'blue';
                                else legendItems[folderName].color = 'black';
                            }
                        }
                    }
                });
            });

            // Gera o HTML da legenda com a contagem
            for (const [name, data] of Object.entries(legendItems)) {
                if (data.count === 0) continue; // Pula se não tiver itens

                let iconHTML = '';
                if (data.isGeometry) {
                    iconHTML = `<span class="legend-color-box" style="border-color: ${data.color};"></span>`;
                } else {
                    const imgUrl = data.icon || 'http://maps.google.com/mapfiles/kml/pushpin/ylw-pushpin.png';
                    iconHTML = `<img src="${imgUrl}" class="legend-icon" alt="${name}">`;
                }
                // Adiciona a contagem ao lado do nome
                legendHTML += `<div class="legend-item">${iconHTML}<span>${name} (${data.count})</span></div>`;
            }

            if (hasItems) {
                legendDiv.innerHTML = legendHTML;
                legendDiv.classList.remove('hidden');
            } else {
                legendDiv.classList.add('hidden');
            }
        }
        
        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('map').innerHTML = `<div style="text-align: center; padding: 50px; font-size: 18px; color: red;">${message}</div>`;
        }

    </script>
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCmDbEaw8opef4jzcAZePv3GFdkxDmC9tk&callback=initMap">
    </script>
</body>
</html>
